<svg xmlns="http://www.w3.org/2000/svg" class="gate-ornament" viewBox="0 0 1200 220" role="img" aria-labelledby="gate-title gate-desc">
  <title id="gate-title">Arabescos do portão da Casa Decorelas</title>
  <desc id="gate-desc">Desenho ornamental simétrico inspirado no ferro trabalhado do portão da casa.</desc>
