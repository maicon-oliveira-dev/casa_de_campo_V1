      <path stroke-width="2.3" d="M986 151 V128 C986 117 977 111 968 115 C958 119 960 132 969 135 C975 137 979 132 976 127" />

      <!-- Volutas centrais inspiradas nos arabescos do portão -->
      <path stroke-width="3.2" d="M600 126 C579 107 555 101 539 108 C521 116 522 136 538 141 C552 145 563 132 555 123 C550 117 540 120 541 127" />
      <path stroke-width="3.2" d="M600 126 C621 107 645 101 661 108 C679 116 678 136 662 141 C648 145 637 132 645 123 C650 117 660 120 659 127" />
      <path stroke-width="2.6" d="M512 119 C489 111 470 116 465 130 C460 143 473 152 484 145 C493 139 489 128 481 129 C476 130 475 135 479 137" />
      <path stroke-width="2.6" d="M688 119 C711 111 730 116 735 130 C740 143 727 152 716 145 C707 139 711 128 719 129 C724 130 725 135 721 137" />

      <!-- Pequenos arabescos laterais -->
      <path stroke-width="2.7" d="M405 127 C386 117 368 119 362 131 C356 144 369 152 379 145 C387 139 383 129 376 130 C372 131 371 135 374 138" />
      <path stroke-width="2.7" d="M795 127 C814 117 832 119 838 131 C844 144 831 152 821 145 C813 139 817 129 824 130 C828 131 829 135 826 138" />
      <path stroke-width="2.4" d="M284 151 C267 144 251 147 247 158 C243 169 254 175 263 169 C270 164 266 156 260 157" />
      <path stroke-width="2.4" d="M916 151 C933 144 949 147 953 158 C957 169 946 175 937 169 C930 164 934 156 940 157" />
    </g>
  </defs>

  <g color="#3d2b20" opacity="0.2" aria-hidden="true">
    <use href="#gate-linework" />
  </g>
  <g color="#3d2b20" mask="url(#reveal-from-center)" aria-hidden="true">
    <use href="#gate-linework" />
  </g>

  <style>
    #reveal-panel { transition: x 700ms cubic-bezier(.2,.75,.25,1), width 700ms cubic-bezier(.2,.75,.25,1); }
    .gate-ornament:hover #reveal-panel,
    .gate-ornament:focus #reveal-panel { x: 0; width: 1200px; }
    @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
      #reveal-panel { x: 0; width: 1200px; transition: none; }
    }
  </style>
</svg>
