<svg xmlns="http://www.w3.org/2000/svg" class="gate-ornament" viewBox="0 0 1200 220" role="img" aria-labelledby="gate-title gate-desc">
  <title id="gate-title">Detalhe do portão da Casa Decorelas</title>
  <desc id="gate-desc">Arco de ferro trabalhado com haste central e volutas simétricas, inspirado no portão da casa.</desc>
  <defs>
    <mask id="reveal-from-center" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="220">
      <rect id="reveal-panel" x="600" y="0" width="0" height="220" fill="white" />
    </mask>
    <g id="gate-linework" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <!-- Duas barras do arco superior, elevando-se suavemente até o centro. -->
      <path stroke-width="3.4" d="M44 173 C230 172 388 135 530 97 C558 89 581 83 600 78 C619 83 642 89 670 97 C812 135 970 172 1156 173" />
      <path stroke-width="2" d="M44 187 C231 186 390 150 533 112 C560 105 583 99 600 95 C617 99 640 105 667 112 C810 150 969 186 1156 187" />

      <!-- Hastes do portão: dupla central com volutas externas e remates laterais. -->
      <path stroke-width="3" d="M594 96 V18" />
      <path stroke-width="3" d="M606 96 V18" />
      <path stroke-width="3" d="M594 27 C580 17 563 20 560 32 C557 43 568 50 577 44 C583 40 581 32 575 32 C570 32 569 38 573 40" />
      <path stroke-width="3" d="M606 27 C620 17 637 20 640 32 C643 43 632 50 623 44 C617 40 619 32 625 32 C630 32 631 38 627 40" />
      <path stroke-width="2.6" d="M439 123 V84 C439 76 431 71 423 74 C414 78 415 90 423 93 C429 96 434 90 431 85 C429 81 424 81 423 85" />
      <path stroke-width="2.6" d="M761 123 V84 C761 76 769 71 777 74 C786 78 785 90 777 93 C771 96 766 90 769 85 C771 81 776 81 777 85" />
      <path stroke-width="2.4" d="M330 148 V116 C330 108 322 103 315 106 C307 110 308 121 315 124 C321 127 326 122 323 117 C321 113 316 113 315 117" />
      <path stroke-width="2.4" d="M870 148 V116 C870 108 878 103 885 106 C893 110 892 121 885 124 C879 127 874 122 877 117 C879 113 884 113 885 117" />

      <!-- Volutas ligadas à haste central, como no topo do portão original. -->
      <path stroke-width="3" d="M600 79 C581 90 557 91 544 82 C532 74 534 60 546 57 C557 54 565 62 561 70 C558 75 550 75 549 70" />
      <path stroke-width="3" d="M600 79 C619 90 643 91 656 82 C668 74 666 60 654 57 C643 54 635 62 639 70 C642 75 650 75 651 70" />
      <path stroke-width="2.6" d="M523 99 C505 109 485 108 476 99 C468 91 471 80 480 78 C489 76 495 83 491 89 C488 93 482 93 481 89" />
      <path stroke-width="2.6" d="M677 99 C695 109 715 108 724 99 C732 91 729 80 720 78 C711 76 705 83 709 89 C712 93 718 93 719 89" />
      <path stroke-width="2.3" d="M440 123 C424 132 407 131 400 123 C393 116 396 106 403 105 C411 103 416 110 412 115 C410 118 405 118 405 114" />
      <path stroke-width="2.3" d="M760 123 C776 132 793 131 800 123 C807 116 804 106 797 105 C789 103 784 110 788 115 C790 118 795 118 795 114" />
    </g>
  </defs>

  <g color="#3d2b20" opacity="0.2" aria-hidden="true">
    <use href="#gate-linework" />
  </g>
  <g color="#3d2b20" mask="url(#reveal-from-center)" aria-hidden="true">
    <use href="#gate-linework" />
  </g>

  <style>
    #reveal-panel { transition: x 700ms cubic-bezier(.2,.75,.25,1), width 700ms cubic-bezier(.2,.75,.25,1); }
    .gate-ornament:hover #reveal-panel,
    .gate-ornament:focus #reveal-panel { x: 0; width: 1200px; }
    @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
      #reveal-panel { x: 0; width: 1200px; transition: none; }
    }
  </style>
</svg>
